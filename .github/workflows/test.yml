name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships bash, jq, git, util-linux and shellcheck.
      - name: shellcheck
        run: shellcheck -x drovr.sh tests/run.sh tests/stub-claude
      - name: tests
        run: tests/run.sh
